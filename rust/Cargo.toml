[package]
name = "plh-rack-monitor"
version = "1.0.0"
edition = "2024"
rust-version = "1.85"
description = "Local real-time dashboard for a host and its Proxmox VE nodes, sized for small ultrawide panels"
publish = false

[features]
default = ["proxmox"]
# Proxmox polling needs an HTTPS client. A build without it is pure Rust and
# carries no C code, which keeps cross-checking other targets simple.
proxmox = ["dep:reqwest", "dep:rustls"]

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
directories = "6.0.0"
getrandom = "0.4.3"
humantime = "2.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "signal", "net"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
toml = "1.1.6"
# ring is the TLS crypto provider: it builds with the platform C compiler,
# whereas aws-lc-rs needs CMake and NASM on Windows.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider"], optional = true }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_Registry",
    "Wdk_System_SystemInformation",
    "Win32_System_Threading",
] }

[build-dependencies]
# Compiles app.rc into the binary. Uses the Windows SDK rc.exe under MSVC and
# windres under the GNU toolchain.
embed-resource = "3.0.11"

[profile.release]
strip = true
lto = "thin"
